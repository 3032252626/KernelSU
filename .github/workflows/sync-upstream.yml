name: 同步上游 rsuntk/KernelSU

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 添加上游远程
        run: |
          git remote add upstream https://github.com/rsuntk/KernelSU.git
          git fetch upstream

      - name: 合并上游更新
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
